name: Release Helm Chart

on:
  push:
    tags:
      - 'charts/*/v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Find previous chart tag
        id: prev-tag
        run: |
          CHART_NAME=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
          PREV=$(git tag --list "charts/${CHART_NAME}/v*" | sort -V | grep -v "${{ github.ref_name }}" | tail -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Publish Helm Chart
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.7"
          verb: call
          module: ./ci
          args: publish --source=. --chart-tag=${{ github.ref_name }} --registry-token=env://GITHUB_TOKEN --repo-owner=${{ github.repository_owner }} --previous-tag=${{ steps.prev-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
